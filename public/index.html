<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DsquareTech CRM · Etsy</title>
  <style>
    :root { --bg:#f6f6f4; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e3e3df; --accent:#f1641e; --ok:#1f8a4c; --err:#c0392b; }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
    header { padding:16px 24px; background:var(--card); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
    header h1 { font-size:18px; margin:0; }
    main { max-width:1200px; margin:0 auto; padding:24px 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:20px; }
    .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
    .spacer { flex:1; }
    button, .btn { font:inherit; border:1px solid var(--line); background:var(--card); padding:8px 14px; border-radius:8px; cursor:pointer; color:var(--ink); text-decoration:none; }
    .primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
    button:disabled { opacity:.6; cursor:wait; }
    .muted { color:var(--muted); }
    .pill { display:inline-block; padding:2px 8px; border-radius:99px; background:#eee; font-size:12px; }
    .pill.active { background:#e3f4ea; color:var(--ok); }
    .pill.draft { background:#eef; color:#446; }
    .pill.sold_out, .pill.expired, .pill.inactive { background:#fbeaea; color:var(--err); }
    .msg { padding:10px 14px; border-radius:8px; margin-bottom:16px; }
    .msg.err { background:#fbeaea; color:var(--err); }
    .msg.ok { background:#e3f4ea; color:var(--ok); }
    .stats { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
    .stat { border:1px solid var(--line); border-radius:8px; padding:8px 12px; min-width:90px; }
    .stat b { display:block; font-size:18px; }
    input, select { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:middle; }
    th { font-size:12px; text-transform:uppercase; color:var(--muted); }
    td img { width:56px; height:44px; object-fit:cover; border-radius:4px; background:#eee; }
    td.title a { color:var(--ink); }
  </style>
</head>
<body>
  <header><h1>DsquareTech CRM</h1><span class="muted">Etsy integration</span></header>
  <main>
    <div id="flash"></div>

    <section class="card" id="connect-card">
      <div class="row">
        <div>
          <h2 style="margin:0 0 4px">Etsy shop</h2>
          <div id="shop-info" class="muted">Loading…</div>
        </div>
        <div class="spacer"></div>
        <a class="btn primary" id="connect-btn" href="/auth/etsy" hidden>Connect Etsy shop</a>
        <button id="sync-btn" hidden>Sync all listings</button>
        <button id="disconnect-btn" hidden>Disconnect</button>
      </div>
      <div class="stats" id="stats"></div>
    </section>

    <section class="card" id="listings-card" hidden>
      <div class="row" style="margin-bottom:12px">
        <input id="search" placeholder="Search title or SKU" />
        <select id="state-filter">
          <option value="">All states</option>
          <option>active</option><option>draft</option><option>inactive</option>
          <option>sold_out</option><option>expired</option>
        </select>
        <div class="spacer"></div>
        <span id="count" class="muted"></span>
        <a class="btn" href="/api/etsy/listings/export.csv">Export CSV</a>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th></th><th>Title</th><th>State</th><th>Price</th><th>Qty</th><th>SKU</th><th>Views</th><th>Favs</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

    function flash(text, kind) {
      $('flash').innerHTML = text ? `<div class="msg ${kind}">${esc(text)}</div>` : '';
    }

    async function loadStatus() {
      const s = await (await fetch('/api/etsy/status')).json();
      $('connect-btn').hidden = s.connected;
      $('sync-btn').hidden = $('disconnect-btn').hidden = !s.connected;
      $('listings-card').hidden = !s.connected;
      if (!s.connected) {
        $('shop-info').textContent = 'No shop connected. Click "Connect Etsy shop" to authorize in one step.';
        $('stats').innerHTML = '';
        return;
      }
      const synced = s.lastSyncAt ? new Date(s.lastSyncAt).toLocaleString() : 'never';
      $('shop-info').innerHTML = `<a href="${esc(s.shop.url)}" target="_blank" rel="noopener">${esc(s.shop.shop_name)}</a> · last sync ${esc(synced)}`;
      if (s.lastSyncError) flash('Last sync failed: ' + s.lastSyncError, 'err');
      $('stats').innerHTML = `<div class="stat"><b>${s.total}</b>total</div>` +
        Object.entries(s.counts).map(([k, v]) => `<div class="stat"><b>${v}</b>${esc(k)}</div>`).join('');
      await loadListings();
    }

    async function loadListings() {
      const params = new URLSearchParams();
      if ($('search').value) params.set('q', $('search').value);
      if ($('state-filter').value) params.set('state', $('state-filter').value);
      const { total, listings } = await (await fetch('/api/etsy/listings?' + params)).json();
      $('count').textContent = `${total} listing${total === 1 ? '' : 's'}`;
      $('rows').innerHTML = listings.map((l) => `
        <tr>
          <td>${l.image ? `<img src="${esc(l.image)}" alt="" loading="lazy">` : ''}</td>
          <td class="title"><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title)}</a></td>
          <td><span class="pill ${esc(l.state)}">${esc(l.state)}</span></td>
          <td>${l.price != null ? esc(l.price.toFixed(2) + ' ' + (l.currency || '')) : ''}</td>
          <td>${esc(l.quantity)}</td>
          <td>${esc(l.sku)}</td>
          <td>${esc(l.views)}</td>
          <td>${esc(l.num_favorers)}</td>
        </tr>`).join('');
    }

    $('sync-btn').onclick = async () => {
      const btn = $('sync-btn');
      btn.disabled = true; btn.textContent = 'Syncing…';
      try {
        const r = await fetch('/api/etsy/listings/sync', { method: 'POST' });
        const body = await r.json();
        if (!r.ok) throw new Error(body.error);
        flash(`Synced ${body.total} listings`, 'ok');
      } catch (e) { flash(e.message, 'err'); }
      btn.disabled = false; btn.textContent = 'Sync all listings';
      loadStatus();
    };

    $('disconnect-btn').onclick = async () => {
      if (!confirm('Disconnect this Etsy shop and remove cached listings?')) return;
      await fetch('/auth/etsy/disconnect', { method: 'POST' });
      flash('Shop disconnected', 'ok');
      loadStatus();
    };

    let t;
    $('search').oninput = () => { clearTimeout(t); t = setTimeout(loadListings, 200); };
    $('state-filter').onchange = loadListings;

    const qs = new URLSearchParams(location.search);
    if (qs.get('error')) flash(qs.get('error'), 'err');
    if (qs.get('connected')) flash('Etsy shop connected and all listings imported.', 'ok');
    if (qs.toString()) history.replaceState(null, '', '/');
    loadStatus();
  </script>
</body>
</html>

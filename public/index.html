<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DsquareTech CRM · Etsy</title>
  <style>
    :root { --bg:#f6f6f4; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e3e3df; --accent:#f1641e; --ok:#1f8a4c; --err:#c0392b; --sel:#fff4ee; }
    * { box-sizing: border-box; }
    [hidden] { display:none !important; }
    body { margin:0; font:14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
    header { padding:16px 24px; background:var(--card); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
    header h1 { font-size:18px; margin:0; }
    main { max-width:1200px; margin:0 auto; padding:24px 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:20px; }
    .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
    .spacer { flex:1; }
    button, .btn { font:inherit; border:1px solid var(--line); background:var(--card); padding:8px 14px; border-radius:8px; cursor:pointer; color:var(--ink); text-decoration:none; display:inline-block; }
    .primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .muted { color:var(--muted); }
    .pill { display:inline-block; padding:2px 8px; border-radius:99px; background:#eee; font-size:12px; }
    .pill.active { background:#e3f4ea; color:var(--ok); }
    .pill.draft { background:#eef; color:#446; }
    .pill.sold_out, .pill.expired, .pill.inactive { background:#fbeaea; color:var(--err); }
    .lang { display:inline-block; padding:1px 6px; margin:1px; border-radius:4px; background:#eef3ff; color:#2b4a9b; font-size:11px; font-weight:600; text-transform:uppercase; }
    .msg { padding:10px 14px; border-radius:8px; margin-bottom:16px; }
    .msg.err { background:#fbeaea; color:var(--err); }
    .msg.ok { background:#e3f4ea; color:var(--ok); }
    .msg.warn { background:#fff6e0; color:#7a5300; }
    .stats { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
    .stat { border:1px solid var(--line); border-radius:8px; padding:8px 12px; min-width:90px; }
    .stat b { display:block; font-size:18px; }
    input, select, textarea { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; }
    input[type=checkbox] { width:16px; height:16px; padding:0; accent-color:var(--accent); cursor:pointer; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:middle; }
    th { font-size:12px; text-transform:uppercase; color:var(--muted); }
    tr.selected td { background:var(--sel); }
    td img { width:56px; height:44px; object-fit:cover; border-radius:4px; background:#eee; display:block; }
    td.title a { color:var(--ink); }
    .selbar { position:sticky; top:0; z-index:5; background:var(--ink); color:#fff; border-radius:8px; padding:10px 14px; margin-bottom:12px; }
    .selbar button { border-color:#555; background:#2c2c2a; color:#fff; }
    .selbar .primary { background:var(--accent); border-color:var(--accent); }

    dialog { width:min(920px, calc(100vw - 32px)); max-height:calc(100vh - 48px); border:none; border-radius:12px; padding:0; box-shadow:0 20px 60px rgba(0,0,0,.25); }
    dialog::backdrop { background:rgba(0,0,0,.4); }
    .dlg-head { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
    .dlg-head h2 { margin:0; font-size:17px; }
    .dlg-body { padding:20px; overflow:auto; max-height:calc(100vh - 200px); }
    .dlg-foot { padding:14px 20px; border-top:1px solid var(--line); display:flex; gap:10px; align-items:center; }
    .langs { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px; margin:12px 0; }
    .langs label { display:flex; gap:8px; align-items:center; border:1px solid var(--line); border-radius:8px; padding:8px 10px; cursor:pointer; }
    .langs label:has(input:checked) { border-color:var(--accent); background:var(--sel); }
    .progress { height:8px; background:#eee; border-radius:99px; overflow:hidden; margin:12px 0 6px; }
    .progress div { height:100%; background:var(--accent); width:0; transition:width .3s; }
    .preview-listing { border:1px solid var(--line); border-radius:10px; margin-bottom:14px; }
    .preview-listing > h3 { margin:0; padding:10px 14px; font-size:14px; background:#fafaf8; border-bottom:1px solid var(--line); border-radius:10px 10px 0 0; }
    .preview-lang { padding:12px 14px; border-bottom:1px solid var(--line); display:grid; gap:6px; }
    .preview-lang:last-child { border-bottom:none; }
    .preview-lang.skip > :not(.lang-head) { opacity:.4; }
    .lang-head { display:flex; align-items:center; gap:8px; font-weight:600; }
    .preview-lang input[type=text], .preview-lang textarea { width:100%; }
    .preview-lang textarea { min-height:90px; resize:vertical; }
    .hint { font-size:12px; color:var(--muted); }
    .hint.bad { color:var(--err); }
    .engine { margin-left:auto; font-size:11px; font-weight:500; color:var(--muted); }
    .preview-lang.untranslated { background:#fff5f5; }
    .preview-lang.untranslated .f-desc { border-color:var(--err); }
    ul.errors { margin:8px 0 0; padding-left:18px; color:var(--err); }
  </style>
</head>
<body>
  <header><h1>DsquareTech CRM</h1><span class="muted">Etsy integration</span></header>
  <main>
    <div id="flash"></div>
    <div id="write-banner" class="msg warn" hidden>
      To update listings, reconnect your shop once so Etsy grants edit permission.
      <a class="btn primary" href="/auth/etsy" style="margin-left:8px">Reconnect shop</a>
    </div>

    <section class="card" id="connect-card">
      <div class="row">
        <div>
          <h2 style="margin:0 0 4px">Etsy shop</h2>
          <div id="shop-info" class="muted">Loading…</div>
        </div>
        <div class="spacer"></div>
        <a class="btn primary" id="connect-btn" href="/auth/etsy" hidden>Connect Etsy shop</a>
        <button id="sync-btn" hidden>Sync all listings</button>
        <button id="disconnect-btn" hidden>Disconnect</button>
      </div>
      <div class="stats" id="stats"></div>
    </section>

    <section class="card" id="listings-card" hidden>
      <div class="selbar row" id="selbar" hidden>
        <b id="sel-count"></b>
        <button id="sel-clear">Clear</button>
        <div class="spacer"></div>
        <button class="primary" id="translate-btn">Translate &amp; update selected</button>
      </div>
      <div class="row" style="margin-bottom:12px">
        <input id="search" placeholder="Search title, SKU or tag" />
        <select id="state-filter" aria-label="State">
          <option value="">All states</option>
          <option>active</option><option>draft</option><option>inactive</option>
          <option>sold_out</option><option>expired</option>
        </select>
        <select id="translated-filter" aria-label="Translation">
          <option value="">All translations</option>
        </select>
        <select id="sort" aria-label="Sort">
          <option value="">Sort: Etsy order</option>
          <option value="updated">Recently updated</option>
          <option value="title">Title A–Z</option>
          <option value="price_asc">Price: low to high</option>
          <option value="price_desc">Price: high to low</option>
          <option value="views">Most views</option>
          <option value="favorites">Most favorites</option>
        </select>
        <button id="clear-filters" hidden>Clear filters</button>
        <div class="spacer"></div>
        <span id="count" class="muted"></span>
        <button id="drafts-btn" hidden></button>
        <a class="btn" href="/api/etsy/listings/export.csv">Export CSV</a>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th><input type="checkbox" id="select-all" title="Select all shown" /></th>
            <th></th><th>Title</th><th>State</th><th>Price</th><th>Qty</th><th>SKU</th><th>Translations</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="dlg">
    <div class="dlg-head"><h2 id="dlg-title">Translate listings</h2><div class="spacer"></div><button id="dlg-close" aria-label="Close">✕</button></div>
    <div class="dlg-body" id="dlg-body"></div>
    <div class="dlg-foot" id="dlg-foot"></div>
  </dialog>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const decode = (s) => { const t = document.createElement('textarea'); t.innerHTML = s ?? ''; return t.value; };

    let status = {};
    let shown = [];               // listings currently in the table
    const selected = new Set();   // listing_ids, kept across search/filter changes
    let busy = false;             // a translate/publish job is running

    function flash(text, kind) {
      $('flash').innerHTML = text ? `<div class="msg ${kind}">${esc(text)}</div>` : '';
    }

    async function api(url, body) {
      const r = await fetch(url, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : undefined);
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || r.statusText);
      return data;
    }

    async function loadStatus() {
      status = await api('/api/etsy/status');
      const s = status;
      $('connect-btn').hidden = s.connected;
      $('sync-btn').hidden = $('disconnect-btn').hidden = !s.connected;
      $('listings-card').hidden = !s.connected;
      $('write-banner').hidden = !s.connected || s.canWrite;
      if (!s.connected) {
        $('shop-info').textContent = 'No shop connected. Click "Connect Etsy shop" to authorize in one step.';
        if (s.setupProblem && !$('flash').textContent) flash('Setup needed: ' + s.setupProblem + ' Then restart the app.', 'err');
        $('stats').innerHTML = '';
        return;
      }
      fillLanguageFilter(s.translationLanguages);
      const nDrafts = (s.drafts?.publishable || 0) + (s.drafts?.untranslated || 0);
      $('drafts-btn').hidden = !nDrafts;
      $('drafts-btn').textContent = `Saved drafts (${nDrafts})`;
      const synced = s.lastSyncAt ? new Date(s.lastSyncAt).toLocaleString() : 'never';
      $('shop-info').innerHTML = `<a href="${esc(s.shop.url)}" target="_blank" rel="noopener">${esc(s.shop.shop_name)}</a> · last sync ${esc(synced)}`;
      if (s.lastSyncError) flash('Last sync failed: ' + s.lastSyncError, 'err');
      $('stats').innerHTML = `<div class="stat"><b>${s.total}</b>total</div>` +
        Object.entries(s.counts).map(([k, v]) => `<div class="stat"><b>${v}</b>${esc(k)}</div>`).join('');
      await loadListings();
    }

    function fillLanguageFilter(langs) {
      const sel = $('translated-filter');
      if (sel.dataset.filled) return;
      sel.dataset.filled = '1';
      const entries = Object.entries(langs || {});
      sel.insertAdjacentHTML('beforeend',
        `<optgroup label="Missing">` +
          `<option value="none">Missing all languages</option>` +
          `<option value="missing:any">Missing at least one language</option>` +
          `${entries.map(([c, n]) => `<option value="missing:${c}">Missing ${esc(n)}</option>`).join('')}</optgroup>` +
        `<optgroup label="Has">` +
          `<option value="has:all">Has all languages</option>` +
          `<option value="any">Has at least one language</option>` +
          `${entries.map(([c, n]) => `<option value="has:${c}">Has ${esc(n)}</option>`).join('')}</optgroup>`);
    }

    async function loadListings() {
      const params = new URLSearchParams();
      if ($('search').value) params.set('q', $('search').value);
      if ($('state-filter').value) params.set('state', $('state-filter').value);
      if ($('translated-filter').value) params.set('translated', $('translated-filter').value);
      if ($('sort').value) params.set('sort', $('sort').value);
      $('clear-filters').hidden = !($('search').value || $('state-filter').value || $('translated-filter').value || $('sort').value);
      const { total, listings } = await api('/api/etsy/listings?' + params);
      shown = listings;
      $('count').textContent = `${total} listing${total === 1 ? '' : 's'}`;
      $('rows').innerHTML = listings.map((l) => `
        <tr data-id="${l.listing_id}" class="${selected.has(l.listing_id) ? 'selected' : ''}">
          <td><input type="checkbox" class="pick" ${selected.has(l.listing_id) ? 'checked' : ''} aria-label="Select listing"></td>
          <td>${l.image ? `<img src="${esc(l.image)}" alt="" loading="lazy">` : ''}</td>
          <td class="title"><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(decode(l.title))}</a></td>
          <td><span class="pill ${esc(l.state)}">${esc(l.state)}</span></td>
          <td>${l.price != null ? esc(l.price.toFixed(2) + ' ' + (l.currency || '')) : ''}</td>
          <td>${esc(l.quantity)}</td>
          <td>${esc(l.sku)}</td>
          <td>${l.translations.map((c) => `<span class="lang">${esc(c)}</span>`).join('')}</td>
        </tr>`).join('');
      updateSelection();
    }

    function updateSelection() {
      const n = selected.size;
      $('selbar').hidden = n === 0;
      $('sel-count').textContent = `${n} selected`;
      const shownSel = shown.filter((l) => selected.has(l.listing_id)).length;
      $('select-all').checked = shown.length > 0 && shownSel === shown.length;
      $('select-all').indeterminate = shownSel > 0 && shownSel < shown.length;
    }

    $('rows').addEventListener('click', (e) => {
      const tr = e.target.closest('tr');
      if (!tr || e.target.closest('a')) return;
      const id = Number(tr.dataset.id);
      const box = tr.querySelector('.pick');
      if (e.target !== box) box.checked = !box.checked;
      box.checked ? selected.add(id) : selected.delete(id);
      tr.classList.toggle('selected', box.checked);
      updateSelection();
    });
    $('select-all').onchange = (e) => {
      for (const l of shown) e.target.checked ? selected.add(l.listing_id) : selected.delete(l.listing_id);
      loadListings();
    };
    $('sel-clear').onclick = () => { selected.clear(); loadListings(); };

    // ---------- Translate dialog ----------

    const dlg = $('dlg');
    const body = (html) => { $('dlg-body').innerHTML = html; };
    const foot = (html) => { $('dlg-foot').innerHTML = html; };
    let lastGen = null; // last generate job: errors, stopped reason, notProcessed
    let reviewPage = 0;
    const PAGE_SIZE = 20;

    $('dlg-close').onclick = async () => {
      if (busy && !confirm('A job is still running in the background. Close anyway?')) return;
      await flushEdits();
      dlg.close();
      loadStatus();
    };
    dlg.addEventListener('cancel', (e) => { if (busy) e.preventDefault(); });

    $('translate-btn').onclick = () => {
      if (!status.canWrite) return flash('Reconnect your shop first so the app can update listings.', 'err');
      if (status.translateProblem) return flash(status.translateProblem, 'err');
      showLanguageStep();
      dlg.showModal();
    };

    $('drafts-btn').onclick = () => {
      lastGen = null;
      reviewPage = 0;
      dlg.showModal();
      showReview();
    };

    function showLanguageStep() {
      $('dlg-title').textContent = `Translate ${selected.size} listing${selected.size === 1 ? '' : 's'}`;
      const shopLangs = (status.shop.languages || []).map((c) => c.split('-')[0]);
      const remembered = JSON.parse(localStorageGet('langs') || '[]');
      body(`
        <p style="margin-top:0">Choose the languages. AI will translate the <b>title, description and tags</b>.
        Each result is saved as a draft right away, so you never have to generate it twice. Nothing changes on Etsy until you publish.</p>
        ${chainSummary()}
        <div class="langs">${Object.entries(status.translationLanguages).map(([code, name]) => `
          <label><input type="checkbox" value="${code}" ${remembered.includes(code) ? 'checked' : ''}>
          ${esc(name)} <span class="muted">${code}</span>
          ${shopLangs.length && !shopLangs.includes(code) ? '<span class="hint" title="Not enabled in your Etsy shop language settings">⚠</span>' : ''}</label>`).join('')}
        </div>
        <label class="hint" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="retranslate">
          Translate again even if a language already has a saved draft or is published</label>
        <p class="hint">Languages marked ⚠ are not enabled in your Etsy shop settings (Shop Manager → Settings → Info &amp; Appearance → Languages); Etsy may reject them.
        A listing is skipped for its own language.</p>`);
      foot(`${status.drafts?.publishable ? '<button id="to-drafts">Saved drafts</button>' : ''}<div class="spacer"></div><button id="gen-btn" class="primary">Generate translations</button>`);
      $('gen-btn').onclick = generate;
      if ($('to-drafts')) $('to-drafts').onclick = () => { reviewPage = 0; showReview(); };
    }

    // Which model/API key combinations are ready, from /api/etsy/status.
    function chainSummary() {
      const chain = status.translatorChain || [];
      const ready = chain.filter((c) => c.state === 'ready');
      if (!chain.length) return '';
      return `<p class="hint">${ready.length} of ${chain.length} model/API key combinations ready` +
        (ready.length ? ` · starts with <b>${esc(ready[0].label)}</b>, switches automatically when a limit is reached.` : ' · all have reached their limits; try again later.') + `</p>`;
    }

    function localStorageGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
    function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

    async function runJob(startUrl, payload, label) {
      busy = true;
      body(`<p>${esc(label)}</p><div class="progress"><div id="bar"></div></div><div id="prog" class="muted">Starting…</div>`);
      foot('');
      try {
        const { jobId } = await api(startUrl, payload);
        for (;;) {
          const job = await api('/api/jobs/' + jobId);
          $('bar').style.width = `${(job.done / job.total) * 100}%`;
          $('prog').textContent = `${job.done} of ${job.total} done${job.errors.length ? ` · ${job.errors.length} failed` : ''}` +
            (job.current ? ` · using ${job.current}` : '');
          if (job.status === 'done') return job;
          await new Promise((r) => setTimeout(r, 1000));
        }
      } finally {
        busy = false;
      }
    }

    async function generate() {
      const languages = [...$('dlg-body').querySelectorAll('.langs input:checked')].map((i) => i.value);
      if (!languages.length) return alert('Choose at least one language');
      localStorageSet('langs', JSON.stringify(languages));
      const retranslate = $('retranslate').checked;
      try {
        const job = await runJob('/api/etsy/translations/generate', { listingIds: [...selected], languages, retranslate },
          `Translating ${selected.size} listing(s) into ${languages.length} language(s)…`);
        lastGen = job;
        // Listings never reached (limits ran out) stay selected for a later run.
        if (job.notProcessed.length) {
          selected.clear();
          job.notProcessed.forEach((l) => selected.add(l.listing_id));
        }
        reviewPage = 0;
        await showReview();
        loadStatus();
      } catch (e) {
        body(`<div class="msg err">${esc(e.message)}</div>`);
        foot(`<div class="spacer"></div><button id="back-btn">Back</button>`);
        $('back-btn').onclick = showLanguageStep;
      }
    }

    function errorList(errors, describe) {
      if (!errors.length) return '';
      const shownErrors = errors.slice(0, 15);
      return `<div class="msg err"><b>${errors.length} failed</b><ul class="errors">${shownErrors.map((e) => `<li>${esc(describe(e.item))}: ${esc(e.error)}</li>`).join('')}` +
        (errors.length > shownErrors.length ? `<li>…and ${errors.length - shownErrors.length} more</li>` : '') + `</ul></div>`;
    }

    function stoppedNotice(job, what) {
      if (!job?.stopped) return '';
      return `<div class="msg warn"><b>Stopped:</b> ${esc(job.stopped)} ${job.done} of ${job.total} ${what} done; ${job.notProcessed.length} not processed yet.</div>`;
    }

    // ---------- Review saved drafts ----------

    async function showReview() {
      await flushEdits();
      const data = await api('/api/etsy/drafts');
      const pages = Math.max(1, Math.ceil(data.listings.length / PAGE_SIZE));
      reviewPage = Math.min(reviewPage, pages - 1);
      const pageItems = data.listings.slice(reviewPage * PAGE_SIZE, (reviewPage + 1) * PAGE_SIZE);
      $('dlg-title').textContent = 'Review translations';
      const notes = stoppedNotice(lastGen, 'listing(s)') +
        (lastGen?.stopped ? `<div class="msg warn">The listings not processed stay selected, so you can translate them later. Everything already translated is saved below.</div>` : '') +
        errorList(lastGen?.errors || [], (l) => decode(l.title)) +
        (data.untranslated ? `<div class="msg err">${data.untranslated} draft(s) still have an <b>English description</b> and will not be published.
          Edit the description, or generate those languages again to retry on another model.</div>` : '');
      body(notes + (data.listings.length
        ? `<p style="margin-top:0" class="muted">${data.listings.length} listing(s) with saved drafts. Edits are saved automatically. Untick a language to skip it.</p>` +
          pageItems.map((d) => `
          <div class="preview-listing">
            <h3>${esc(d.title)}</h3>
            ${Object.entries(d.langs).map(([code, t]) => `
              <div class="preview-lang ${t.include ? '' : 'skip'} ${t.untranslated ? 'untranslated' : ''}" data-id="${d.listing_id}" data-lang="${code}">
                <label class="lang-head"><input type="checkbox" class="include" ${t.include ? 'checked' : ''}> <span class="lang">${code}</span> ${esc(status.translationLanguages[code] || code)}
                  <span class="engine">${esc(t.engine || '')}</span></label>
                <input type="text" class="f-title" value="${esc(t.title)}" maxlength="140" aria-label="Title">
                <span class="hint t-count"></span>
                <textarea class="f-desc" aria-label="Description">${esc(t.description)}</textarea>
                <span class="hint bad d-warn">${t.untranslated ? 'Description is still in English, so it will not be published. Translate it here or generate again.' : ''}</span>
                <input type="text" class="f-tags" value="${esc(t.tags.join(', '))}" aria-label="Tags">
                <span class="hint g-count"></span>
              </div>`).join('')}
          </div>`).join('')
        : '<p class="muted">No saved drafts. Select listings and click "Translate &amp; update selected".</p>'));
      $('dlg-body').scrollTop = 0;
      $('dlg-body').querySelectorAll('.preview-lang').forEach(validateBlock);
      $('dlg-body').oninput = (e) => {
        const b = e.target.closest('.preview-lang');
        if (b) { validateBlock(b); queueEdit(b); }
      };
      $('dlg-body').onchange = (e) => {
        const b = e.target.closest('.preview-lang');
        if (!b) return;
        if (e.target.matches('.include')) b.classList.toggle('skip', !e.target.checked);
        queueEdit(b, 0);
      };
      foot(`<button id="back-btn">Translate more</button>
            ${pages > 1 ? `<button id="prev-page" ${reviewPage === 0 ? 'disabled' : ''}>‹</button><span class="muted">Page ${reviewPage + 1} / ${pages}</span><button id="next-page" ${reviewPage >= pages - 1 ? 'disabled' : ''}>›</button>` : ''}
            <div class="spacer"></div>
            ${data.listings.length ? '<button id="discard-btn">Discard all drafts</button>' : ''}
            <span class="muted">${data.publishable} ready</span>
            <button id="pub-btn" class="primary" ${data.publishable ? '' : 'disabled'}>Publish all to Etsy</button>`);
      $('back-btn').onclick = async () => { await flushEdits(); showLanguageStep(); };
      if ($('prev-page')) $('prev-page').onclick = () => { reviewPage--; showReview(); };
      if ($('next-page')) $('next-page').onclick = () => { reviewPage++; showReview(); };
      if ($('discard-btn')) $('discard-btn').onclick = async () => {
        if (!confirm('Delete all saved drafts? They will have to be generated again.')) return;
        await fetch('/api/etsy/drafts', { method: 'DELETE' });
        loadStatus();
        showReview();
      };
      $('pub-btn').onclick = publish;
    }

    function tagsOf(block) { return block.querySelector('.f-tags').value.split(',').map((t) => t.trim()).filter(Boolean); }

    function validateBlock(b) {
      const title = b.querySelector('.f-title').value;
      b.querySelector('.t-count').textContent = `Title ${title.length}/140`;
      const tags = tagsOf(b);
      const long = tags.filter((t) => t.length > 20);
      const gc = b.querySelector('.g-count');
      gc.textContent = `Tags ${tags.length}/13, comma separated` + (long.length ? ` · too long (max 20): ${long.join(', ')}` : '') + (tags.length > 13 ? ' · only the first 13 are used' : '');
      gc.classList.toggle('bad', long.length > 0 || tags.length > 13);
    }

    // Edits are saved to the server shortly after typing stops.
    const pendingEdits = new Map(); // block -> timer
    function queueEdit(block, delay = 600) {
      clearTimeout(pendingEdits.get(block));
      pendingEdits.set(block, setTimeout(() => saveEdit(block), delay));
    }
    async function saveEdit(block) {
      pendingEdits.delete(block);
      const saved = await fetch(`/api/etsy/drafts/${block.dataset.id}/${block.dataset.lang}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: block.querySelector('.f-title').value,
          description: block.querySelector('.f-desc').value,
          tags: tagsOf(block),
          include: block.querySelector('.include').checked,
        }),
      }).then((r) => r.json()).catch(() => null);
      if (saved) {
        block.classList.toggle('untranslated', saved.untranslated);
        block.querySelector('.d-warn').textContent = saved.untranslated ? 'Description is still in English, so it will not be published. Translate it here or generate again.' : '';
      }
    }
    async function flushEdits() {
      const blocks = [...pendingEdits.keys()];
      blocks.forEach((b) => clearTimeout(pendingEdits.get(b)));
      await Promise.all(blocks.map(saveEdit));
    }

    async function publish() {
      await flushEdits();
      const n = (await api('/api/etsy/drafts')).publishable;
      if (!confirm(`Publish ${n} translation(s) to your live Etsy listings, one at a time?`)) return;
      try {
        const job = await runJob('/api/etsy/drafts/publish', {}, `Publishing ${n} translation(s) to Etsy, one at a time…`);
        const left = (await api('/api/etsy/drafts')).publishable;
        const ok = job.results.length;
        $('dlg-title').textContent = 'Publish finished';
        body((ok ? `<div class="msg ok">Published ${ok} translation${ok === 1 ? '' : 's'} to Etsy.</div>` : '') +
          stoppedNotice(job, 'translation(s)') +
          errorList(job.errors, (i) => `${decode(shown.find((l) => l.listing_id === i.listing_id)?.title || '#' + i.listing_id)} (${i.language})`) +
          (left ? `<p>${left} draft(s) are still saved. Publish again to continue where it stopped.</p>` : ''));
        foot(`<button id="review-btn">Review drafts</button><div class="spacer"></div>
              ${left ? '<button id="again-btn" class="primary">Publish remaining</button>' : ''}<button id="done-btn" ${left ? '' : 'class="primary"'}>Close</button>`);
        $('review-btn').onclick = () => { lastGen = null; reviewPage = 0; showReview(); };
        if ($('again-btn')) $('again-btn').onclick = publish;
        $('done-btn').onclick = () => { dlg.close(); loadStatus(); };
        loadListings();
      } catch (e) {
        body(`<div class="msg err">${esc(e.message)}</div>`);
        foot(`<div class="spacer"></div><button id="back-btn">Back to review</button>`);
        $('back-btn').onclick = () => showReview();
      }
    }

    // ---------- Shop actions ----------

    $('sync-btn').onclick = async () => {
      const btn = $('sync-btn');
      btn.disabled = true; btn.textContent = 'Syncing…';
      try {
        const r = await api('/api/etsy/listings/sync', {});
        flash(`Synced ${r.total} listings`, 'ok');
      } catch (e) { flash(e.message, 'err'); }
      btn.disabled = false; btn.textContent = 'Sync all listings';
      loadStatus();
    };

    $('disconnect-btn').onclick = async () => {
      if (!confirm('Disconnect this Etsy shop and remove cached listings?')) return;
      await api('/auth/etsy/disconnect', {});
      selected.clear();
      flash('Shop disconnected', 'ok');
      loadStatus();
    };

    let t;
    $('search').oninput = () => { clearTimeout(t); t = setTimeout(loadListings, 200); };
    $('state-filter').onchange = $('translated-filter').onchange = $('sort').onchange = loadListings;
    $('clear-filters').onclick = () => {
      $('search').value = $('state-filter').value = $('translated-filter').value = $('sort').value = '';
      loadListings();
    };

    const qs = new URLSearchParams(location.search);
    if (qs.get('error')) flash(qs.get('error'), 'err');
    if (qs.get('connected')) flash('Etsy shop connected and all listings imported.', 'ok');
    if (qs.toString()) history.replaceState(null, '', '/');
    loadStatus();
  </script>
</body>
</html>

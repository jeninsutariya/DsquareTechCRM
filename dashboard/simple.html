<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Revenue Total</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Sans:wght@600;700&display=swap">
<style>
:root {
  color-scheme: light;
  --page: #f3f5f8; --surface: #ffffff; --surface-2: #f7f9fb;
  --ink: #0f1b2d; --ink-2: #4a5568; --muted: #7a8494;
  --line: #e2e6ec; --line-strong: #c9d0da;
  --accent: #1d4f9c; --accent-ink: #ffffff;
  --bad: #b42323;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0c1119; --surface: #141b26; --surface-2: #19212e;
    --ink: #eef2f7; --ink-2: #b7c0cd; --muted: #8791a0;
    --line: #243042; --line-strong: #34425a;
    --accent: #6ea2f0; --accent-ink: #0c1119;
    --bad: #f07272;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0c1119; --surface: #141b26; --surface-2: #19212e;
  --ink: #eef2f7; --ink-2: #b7c0cd; --muted: #8791a0;
  --line: #243042; --line-strong: #34425a;
  --accent: #6ea2f0; --accent-ink: #0c1119;
  --bad: #f07272;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 16px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
[hidden] { display: none !important; }
h1, h2 { margin: 0; font-family: "Instrument Sans", "IBM Plex Sans", system-ui, sans-serif; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell { width: 100%; padding-inline: clamp(16px, 3vw, 48px); padding-block: 28px 48px; display: grid; gap: 24px; }
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
h1 { font-size: clamp(26px, 2.6vw, 36px); }
.file { color: var(--muted); font-size: 13px; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 8px;
  background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover { filter: brightness(1.08); }
.btn svg { width: 16px; height: 16px; }
.btn.secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); font: inherit; font-weight: 600; }
.btn.secondary:hover { filter: none; background: var(--surface-2); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }


.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.panel h2 { font-size: clamp(17px, 1.5vw, 22px); padding: 20px clamp(16px, 2vw, 28px) 14px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: clamp(11px, 1.1vw, 16px) clamp(16px, 2vw, 28px); text-align: right; border-top: 1px solid var(--line); }
tbody td, tfoot td { font-size: clamp(15px, 1.2vw, 18px); }
th:nth-child(-n+3), td:nth-child(-n+3) { text-align: left; }
.type { width: 1%; white-space: nowrap; }
.type select { height: 36px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 15px; cursor: pointer; }
thead th { background: var(--surface-2); font-size: 13px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); }
tbody td:last-child { font-weight: 600; }
.net { color: var(--ink-2); white-space: nowrap; }
tfoot td { background: var(--surface-2); font-weight: 700; border-top: 2px solid var(--line-strong); }
.num { color: var(--muted); width: 1%; white-space: nowrap; }
.amount { display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; }
.amount input { width: 11ch; height: 36px; padding: 0 10px; text-align: right; border: 1px solid var(--line-strong); border-radius: 8px;
  background: var(--surface); color: var(--ink); font: inherit; font-weight: 600; font-variant-numeric: tabular-nums; }
.amount input:hover { border-color: var(--accent); }
.amount input.edited { background: var(--surface-2); border-color: var(--accent); }
.amount input.invalid { border-color: var(--bad); color: var(--bad); }

.extras { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; padding: 20px clamp(16px, 2vw, 28px); border-top: 2px solid var(--line-strong); }
.extras label { display: grid; gap: 6px; min-width: 0; }
.extras label > span:first-child { font-size: 13px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); }
.extras input { width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 8px;
  background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.extras input:hover { border-color: var(--accent); }
.inr { position: relative; display: block; }
.inr::before { content: "₹"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-2); font-weight: 600; font-size: 16px; pointer-events: none; }
.inr input { padding-left: 28px; }
@media (max-width: 800px) { .extras { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 420px) { .extras { grid-template-columns: minmax(0, 1fr); } }
.msg { background: var(--surface); border: 1px dashed var(--line-strong); border-radius: 12px; padding: 24px; color: var(--ink-2); }
.msg.error { color: var(--bad); border-color: var(--bad); }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div>
      <h1>App Revenue</h1>
      <p class="file" id="fileName">Loading…</p>
    </div>
    <div class="actions">
    <button type="button" class="btn secondary" id="clearAll" hidden>Clear all</button>
    <label class="btn" for="fileInput">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 11V2M4.5 5.5 8 2l3.5 3.5M2.5 10.5v3h11v-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Upload Excel
    </label>
    </div>
    <input id="fileInput" type="file" accept=".xlsx,.xls,.xlsm,.csv" hidden>
  </header>

  <p class="msg" id="msg" hidden></p>

  <section class="panel" id="tablePanel" hidden>
    <h2>Total revenue by app</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th class="num">#</th><th>App</th><th class="type">Type</th><th>Total revenue</th><th>After 10% deduction</th></tr></thead>
        <tbody id="rows"></tbody>
        <tfoot><tr><td></td><td>All apps</td><td></td><td id="footTotal"></td><td id="footNet"></td></tr></tfoot>
      </table>
    </div>
    <div class="extras" id="extras">
      <label for="usdRate"><span>USD Rate</span><span class="inr"><input id="usdRate" inputmode="decimal" autocomplete="off"></span></label>
      <label for="invalidTraffic"><span>Other/AdX Invalid Traffic</span><span class="inr"><input id="invalidTraffic" inputmode="decimal" autocomplete="off"></span></label>
      <label for="tds"><span>TDS</span><span class="inr"><input id="tds" inputmode="decimal" autocomplete="off"></span></label>
      <label for="netInr"><span>Net Amount (INR)</span><span class="inr"><input id="netInr" inputmode="decimal" autocomplete="off"></span></label>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="analytics.js"></script>
<script>
(function () {
  'use strict';
  const RA = RevenueAnalytics;
  const DEFAULT_FILE = 'data/revenue.xlsx';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const money = (n) => fmt.format(Number.isFinite(n) && Math.abs(n) >= 0.005 ? n : 0);

  // Each app's type is remembered in this browser; Company is the default.
  const TYPES = ['Company', 'Personal', 'Other'];
  const TYPE_KEY = 'appRevenue.types';
  let types = {};
  try { types = JSON.parse(localStorage.getItem(TYPE_KEY)) || {}; } catch (e) { types = {}; }
  const saveTypes = () => { try { localStorage.setItem(TYPE_KEY, JSON.stringify(types)); } catch (e) { /* storage unavailable */ } };

  // Edited revenue per app, also remembered in this browser. Uploading a new file or Clear all resets it.
  const EDIT_KEY = 'appRevenue.edits';
  let edits = {};
  try { edits = JSON.parse(localStorage.getItem(EDIT_KEY)) || {}; } catch (e) { edits = {}; }
  const saveEdits = () => { try { localStorage.setItem(EDIT_KEY, JSON.stringify(edits)); } catch (e) { /* storage unavailable */ } };
  let fileTotals = new Map();
  const valueFor = (app) => (Number.isFinite(edits[app]) ? edits[app] : fileTotals.get(app) || 0);
  const plain = (n) => (Math.round(n * 100) / 100).toFixed(2);
  function amountInput(app, i) {
    const edited = Number.isFinite(edits[app]);
    return `<span class="amount">$<input id="rev-${i}" data-app="${esc(app)}" inputmode="decimal" autocomplete="off"
      class="${edited ? 'edited' : ''}" value="${plain(valueFor(app))}" aria-label="Total revenue for ${esc(app)}"
      title="${edited ? `Edited. Value in the file: ${money(fileTotals.get(app) || 0)}. Clear the box to restore it.` : 'Click to edit'}"></span>`;
  }
  // Revenue minus 10%. Read-only: always worked out from the total revenue box.
  const DEDUCTION = 0.10;
  const net = (n) => n * (1 - DEDUCTION);
  function updateFooter() {
    const total = RA.sum([...fileTotals.keys()].map(valueFor));
    $('footTotal').textContent = money(total);
    $('footNet').textContent = money(net(total));
  }

  function typeSelect(app, i) {
    const cur = TYPES.includes(types[app]) ? types[app] : TYPES[0];
    return `<select id="type-${i}" data-app="${esc(app)}" aria-label="Type for ${esc(app)}">` +
      TYPES.map((t) => `<option${t === cur ? ' selected' : ''}>${t}</option>`).join('') + '</select>';
  }

  function show(msg, isError) {
    $('msg').hidden = !msg;
    $('msg').textContent = msg || '';
    $('msg').classList.toggle('error', !!isError);
  }

  function render(buffer, name) {
    let records;
    try {
      records = RA.parseWorkbook(XLSX, XLSX.read(buffer, { type: 'array' })).records;
    } catch (err) {
      show(`Could not read “${name}”. The sheet needs a Date column, an App column and a revenue column.`, true);
      return;
    }
    const m = RA.compute(records, {});
    fileTotals = new Map(m.apps.map((a) => [a.name, a.total]));
    $('fileName').textContent = name;
    $('rows').innerHTML = m.apps.map((a, i) =>
      `<tr><td class="num">${i + 1}</td><td>${esc(a.name)}</td><td class="type">${typeSelect(a.name, i)}</td><td>${amountInput(a.name, i)}</td><td class="net" id="net-${i}">${money(net(valueFor(a.name)))}</td></tr>`).join('');
    updateFooter();
    show('');
    $('tablePanel').hidden = false;
    $('clearAll').hidden = false;
  }

  function clearAll() {
    edits = {}; saveEdits(); fileTotals = new Map();
    extras = {}; saveExtras(); fillExtras();
    $('rows').innerHTML = '';
    $('footTotal').textContent = '';
    $('footNet').textContent = '';
    $('tablePanel').hidden = true;
    $('clearAll').hidden = true;
    $('fileName').textContent = 'No file loaded';
    show('Cleared. Upload an Excel file to see the total revenue for every app.');
  }

  // The four boxes under the table, remembered in this browser until Clear all.
  const EXTRA_KEY = 'appRevenue.extras';
  const EXTRA_IDS = ['usdRate', 'invalidTraffic', 'tds', 'netInr'];
  let extras = {};
  try { extras = JSON.parse(localStorage.getItem(EXTRA_KEY)) || {}; } catch (e) { extras = {}; }
  function saveExtras() { try { localStorage.setItem(EXTRA_KEY, JSON.stringify(extras)); } catch (e) { /* storage unavailable */ } }
  function fillExtras() { EXTRA_IDS.forEach((id) => { $(id).value = extras[id] || ''; }); }
  fillExtras();
  $('extras').addEventListener('input', (e) => {
    if (!EXTRA_IDS.includes(e.target.id)) return;
    extras[e.target.id] = e.target.value;
    saveExtras();
  });

  $('clearAll').addEventListener('click', clearAll);
  $('rows').addEventListener('change', (e) => {
    if (e.target.matches('select[data-app]')) { types[e.target.dataset.app] = e.target.value; saveTypes(); }
  });
  $('rows').addEventListener('input', (e) => {
    const box = e.target;
    if (!box.matches('input[data-app]')) return;
    const app = box.dataset.app;
    const v = box.value.trim() === '' ? null : RA.parseAmount(box.value);
    box.classList.toggle('invalid', box.value.trim() !== '' && v === null);
    if (box.value.trim() === '') delete edits[app];
    else if (v !== null) edits[app] = v;
    box.classList.toggle('edited', Number.isFinite(edits[app]));
    saveEdits();
    box.closest('tr').querySelector('.net').textContent = money(net(valueFor(app)));
    updateFooter();
  });
  // Tidy the box when leaving it: an empty box goes back to the file's value.
  $('rows').addEventListener('focusout', (e) => {
    const box = e.target;
    if (!box.matches('input[data-app]')) return;
    box.classList.remove('invalid');
    box.value = plain(valueFor(box.dataset.app));
    box.closest('tr').querySelector('.net').textContent = money(net(valueFor(box.dataset.app)));
  });

  $('fileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) { edits = {}; saveEdits(); file.arrayBuffer().then((buf) => render(buf, file.name)); }
    e.target.value = '';
  });

  fetch(DEFAULT_FILE, { cache: 'no-store' })
    .then((r) => { if (!r.ok) throw new Error(); return r.arrayBuffer(); })
    .then((buf) => render(buf, DEFAULT_FILE.split('/').pop()))
    .catch(() => { $('fileName').textContent = 'No file loaded'; show('Upload an Excel file to see the total revenue for every app.'); });
})();
</script>
</body>
</html>
